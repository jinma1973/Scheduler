name: Build APK
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install NPM
        run: npm install

      - name: Capacitor Sync
        run: |
          mkdir -p www
          cp index.html style.css app.js www/ || true
          npx cap add android || true
          npx cap sync android

      - name: Fix Maven Repository 429 Error
        run: |
          cd android
          # Заменяем mavenCentral() на зеркала, которые не банят
          sed -i 's/mavenCentral()/maven { url "https:\/\/maven.google.com" }; maven { url "https:\/\/jitpack.io" }/g' build.gradle
          sed -i 's/mavenCentral()/maven { url "https:\/\/maven.google.com" }; maven { url "https:\/\/jitpack.io" }/g' settings.gradle || true

      - name: Build Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
