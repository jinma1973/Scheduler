<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Планировщик</title>
<style>
  :root{
    --bg:#f8fafc; --fg:#0f172a; --muted:#64748b; --line:#e2e8f0;
    --primary:#4f46e5; --primary-fg:#fff; --card:#fff;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--fg);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; font-size:15px;}
  header{background:var(--primary);color:var(--primary-fg);
    padding:12px 16px;font-weight:600;display:flex;}
  header h1{font-size:17px;margin:0;flex:1}
  nav{display:flex;gap:4px;padding:8px;background:var(--card);
    border-bottom:1px solid var(--line);}
  nav button{flex:1;padding:8px;border:none;border-radius:8px;
    background:transparent;color:var(--muted);font-size:14px;cursor:pointer;}
  nav button.active{background:var(--primary);color:#fff}
  main{padding:12px}
  .tab{display:none}
  .tab.active{display:block}
  .card{background:var(--card);border:1px solid var(--line);
    border-radius:12px;padding:12px;margin-bottom:12px}
  .card h2{font-size:15px;margin:0 0 10px;color:var(--muted);
    font-weight:600;text-transform:uppercase;}
  button.btn{padding:10px 16px;border:none;border-radius:10px;
    background:var(--primary);color:#fff;font-size:14px;cursor:pointer;}
  input,select{padding:8px 10px;border:1px solid var(--line);border-radius:8px;
    font-size:14px;background:#fff;color:var(--fg);width:100%}
  label{display:flex;align-items:center;gap:6px;font-size:14px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .muted{color:var(--muted);font-size:13px}
</style>
</head>
<body>

<header>
  <h1>Планировщик</h1>
</header>

<nav id="nav">
  <button data-tab="plan" class="active">План</button>
  <button data-tab="settings">Настройки</button>
</nav>

<main>
  <section class="tab active" id="tab-plan">
    <div class="card">
      <h2>Период и итоги</h2>
      <div id="periodInfo" class="muted">Период будет здесь.</div>
    </div>
  </section>

  <section class="tab" id="tab-settings">
    <div class="card">
      <h2>Настройки</h2>
      <p>Здесь будут музыканты и накопленные баллы.</p>
      <button class="btn" onclick="alert('Кнопка в настройках работает!')">Проверить</button>
    </div>
  </section>
</main>

<script>
  document.getElementById('nav').addEventListener('click', function(e) {
    var btn = e.target.closest('button[data-tab]');
    if(!btn) return;
    
    // Красим кнопки
    var btns = document.querySelectorAll('#nav button');
    for(var i=0; i<btns.length; i++) {
      btns[i].classList.remove('active');
    }
    btn.classList.add('active');

    // Переключаем экраны
    var tabs = document.querySelectorAll('.tab');
    for(var j=0; j<tabs.length; j++) {
      tabs[j].classList.remove('active');
    }
    document.getElementById('tab-' + btn.dataset.tab).classList.add('active');
  });
</script>
</body>
</html>
